<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lend against restricted tokenized assets, backed by buyers who have already locked USDT." />
    <meta name="color-scheme" content="light dark" />
    <title>Standby</title>
    <script>
      // Apply the saved theme before first paint (Settings stores it in localStorage).
      try {
        var t = JSON.parse(localStorage.getItem('standby:settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
