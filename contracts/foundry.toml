[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Whitechain Sepolia blocks carry Cancun and Prague fields (checked 2026-11-06); confirm with the C1 deploy spike.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "../packages/shared/src/deployments.json" },
  { access = "read-write", path = "../.local" },
  { access = "read", path = "./out" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
whitechain = "${WC_RPC_URL}"

[fmt]
line_length = 110

[lint]
lint_on_build = false
